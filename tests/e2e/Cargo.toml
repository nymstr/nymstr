[package]
name = "nymstr-e2e-tests"
version = "0.1.0"
edition = "2021"
publish = false

# This crate exists only for integration tests
[lib]
path = "src/lib.rs"

[dependencies]
nymstr-common = { path = "../../crates/nymstr-common" }
nymstr-crypto = { path = "../../crates/nymstr-crypto" }
nymstr-transport = { path = "../../crates/nymstr-transport" }
nymstr-server = { path = "../../nymstr-server" }

tokio = { version = "1", features = ["full"] }
serde_json = "1.0"
anyhow = "1.0"
base64 = "0.21"
chrono = "0.4"
tempfile = "3"
log = "0.4"
